name: NexusEngine CI - C++20 & Java 22 Core

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cpp-core:
    name: C++20 Core & Latency Profiling
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Compiler & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang ninja-build

    - name: Configure CMake (-O3 Release)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=clang++

    - name: Build All Targets
      run: cmake --build build --config Release

    - name: Run Core Unit Tests (FIFO, IOC, FOK, O(1) Cancel)
      run: ./build/engine_unit_tests

    - name: Run Advanced Institutional Tests (Iceberg, STP, FIX 4.2, WAL Replay)
      run: ./build/advanced_unit_tests

    - name: Run Microsecond Latency Benchmark (1M Orders)
      run: ./build/engine_benchmark

  java-core:
    name: Java 22 Core & Throughput Benchmark
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '22'

    - name: Compile Java 22 Engine Sources
      run: |
        mkdir -p bin
        javac -d bin java/src/com/engine/model/*.java java/src/com/engine/core/*.java java/src/com/engine/ringbuffer/*.java java/src/com/engine/benchmark/*.java java/src/com/engine/test/*.java

    - name: Run Java Unit Tests
      run: |
        java -cp bin com.engine.test.OrderBookTest
        java -cp bin com.engine.test.IdempotencyTest

    - name: Run Java 22 Latency & Throughput Benchmark (1M Orders)
      run: java -cp bin com.engine.benchmark.ThroughputBenchmark
